
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Minha Princesa ❤️</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <div class="hearts" id="hearts"></div>

    <main class="container">

        <div class="intro" id="intro">

            <h1>Para minha princesa</h1>

            <div class="envelope" id="envelope">
                <div class="envelope-back"></div>
                <div class="letter-preview"></div>
                <div class="envelope-front"></div>
                <div class="envelope-flap"></div>

                <div class="seal">♥</div>
            </div>

            <p class="instruction">Toque no envelope para abrir</p>
        </div>

        <section class="letter" id="letter">

            <div class="letter-content">

                <span class="decoration">✦</span>

                <p class="date">UM DIA ESPECIAL</p>

                <h2>Feliz aniversário,<br>
                    <span>minha princesa!</span>
                </h2>

                <div class="divider">♡</div>

                <h3>Jordinho ❤️</h3>

                <div class="cake">🎂</div>

            </div>
        </section>

        <button class="reopen" id="reopen">
            ↻ Ler novamente
        </button>

    </main>

    <script src="script.js"></script>
</body>
</html>
